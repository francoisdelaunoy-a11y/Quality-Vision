name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Creates the Pages site if the repository has none yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # configure-pages only creates a missing site; it leaves an existing
      # one on the "deploy from a branch" source. That legacy builder then
      # runs on every push alongside this workflow and serves the raw
      # repository root (a blank page) whenever it finishes last. Switch the
      # source to GitHub Actions so only this workflow deploys.
      - name: Set Pages source to GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
            && echo "Pages source is now GitHub Actions" \
            || echo "::warning::Could not switch the Pages source. Set Settings > Pages > Source to GitHub Actions by hand."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
